[package]
name = "iicp-directory-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Rust reference implementation of the IICP directory control plane (read path first; federation per ADR-013)."
repository = "https://github.com/RobLe3/iicp.network"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
