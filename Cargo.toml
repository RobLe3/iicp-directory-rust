[package]
name = "iicp-directory-rs"
version = "0.1.15"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
description = "Pre-1.0 Rust operator preview of the IICP directory control plane."
repository = "https://github.com/RobLe3/iicp-directory-rust"
readme = "README.md"
keywords = ["iicp", "directory", "agents", "discovery"]
categories = ["network-programming", "web-programming"]
include = [
  "/Cargo.toml",
  "/Cargo.lock",
  "/LICENSE",
  "/README.md",
  "/OPERATIONS.md",
  "/PARITY.md",
  "/RELEASE_POLICY.md",
  "/SECURITY.md",
  "/src/**",
  "/schema/**",
  "/migrations/**",
  "/parity/**",
  "/compatibility/**",
  "/tests/**",
  "/examples/**",
  "/scripts/directory_self_update.sh",
  "/scripts/validate_runtime_health_arm.sh",
  "/scripts/validate_systemd_watchdog.sh",
]

[dependencies]
base64 = "0.22"
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
# Federation event-log signature verification (#385/ADR-013). ed25519-compact:
# pure-Rust, minimal transitive footprint, by jedisct1 (libsodium author) — matches
# the PHP seed's libsodium sodium_crypto_sign scheme. TC-11 cleared (see PARITY.md).
ed25519-compact = "2"
# Federation replica HTTP sync (poll seed /v1/events, resolve DID). reqwest with
# rustls-tls+json — the same client the project already vets in iicp-client-rust;
# async-native (no hand-rolled HTTP on the control plane). [TC-11: project-precedented]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# base64url for the seed DID document's Ed25519 JWK `x` field. Already in the tree
# via ed25519-compact (same author, jedisct1); promoting to a direct dep adds zero
# new transitive surface.
ct-codecs = "1"
serde_jcs = "0.2.0"
clap = { version = "4", features = ["derive"] }
semver = "1"
mdns-sd = { version = "0.21", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = { version = "0.5", optional = true }

[features]
default = ["systemd-notify"]
systemd-notify = ["dep:sd-notify"]
runtime-health-fault-injection = []

[[example]]
name = "systemd_watchdog_fixture"
required-features = ["systemd-notify", "runtime-health-fault-injection"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
