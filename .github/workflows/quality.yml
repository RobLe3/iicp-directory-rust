name: Rust directory quality

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: docker build --pull -t iicp-directory-rust:quality .
      - run: test "$(docker image inspect iicp-directory-rust:quality --format '{{.Config.User}}')" = "10001:10001"

  event-log-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: iicp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      IICP_TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/iicp?ssl-mode=DISABLED
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: >-
          cargo test --locked
          concurrent_signed_event_appends_are_gap_free_and_chain_correct
          -- --ignored

  credit-ledger-concurrency:
