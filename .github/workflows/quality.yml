      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - run: >-
          cargo test --locked
          concurrent_credit_awards_preserve_dual_write_and_ledger_total
          -- --ignored

